<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas Vida Nueva Internacional</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + tab bar, one working column (max 1180px); cards only for objects (eventos, formularios). Colores tomados del logo: azul marino, rojo llama, azul cielo. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --surface-2:#F7F8FD; --ink:#141847; --muted:#5A6085; --line:#DCE0EE;
  --navy:#1B1F7A; --navy-solid:#1B1F7A; --on-navy:#FFFFFF; --navy-tint:#E6E8F7;
  --red:#D71F26; --red-tint:#FCE8E9; --sky:#1C8ACB; --sky-tint:#E2F1FA;
  --good:#17804A; --good-tint:#E1F3E8; --warn:#B86A00; --warn-tint:#FBF0DD;
  --shadow:0 1px 2px rgba(20,24,71,.06),0 4px 16px rgba(20,24,71,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1030; --surface:#161A44; --surface-2:#1B2050; --ink:#E8EAFB; --muted:#A0A5CC; --line:#2B3067;
  --navy:#A9AEFF; --navy-solid:#3D44C8; --on-navy:#FFFFFF; --navy-tint:#252B6B;
  --red:#FF6167; --red-tint:#3D1A2A; --sky:#62BDF3; --sky-tint:#16345A;
  --good:#52C986; --good-tint:#153D32; --warn:#F2AE45; --warn-tint:#3D2F1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1030; --surface:#161A44; --surface-2:#1B2050; --ink:#E8EAFB; --muted:#A0A5CC; --line:#2B3067;
  --navy:#A9AEFF; --navy-solid:#3D44C8; --on-navy:#FFFFFF; --navy-tint:#252B6B;
  --red:#FF6167; --red-tint:#3D1A2A; --sky:#62BDF3; --sky-tint:#16345A;
  --good:#52C986; --good-tint:#153D32; --warn:#F2AE45; --warn-tint:#3D2F1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.2px}
h2{font-size:1.65rem;color:var(--navy)}
h3{font-size:1.2rem}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.plate{background:#fff;border-radius:8px;padding:4px 8px;display:flex;border:1px solid var(--line)}
.plate img{height:44px;width:auto;display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-txt b{font-family:var(--f-display);font-size:1.55rem;color:var(--navy);font-weight:700}
.brand-txt span{font-family:var(--f-display);font-size:.72rem;letter-spacing:.38em;color:var(--red);font-weight:600}
.mode{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.ok i{background:var(--good)} .mode.local i{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.3px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--red)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.day:focus-visible,.evcard:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 60px;display:flex;flex-direction:column;gap:22px}
.banner{border-radius:var(--r);padding:10px 14px;font-size:.9rem;background:var(--warn-tint);color:var(--ink);border:1px solid var(--line)}

/* Controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:38px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy-solid);border-color:var(--navy-solid);color:var(--on-navy)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.good{color:var(--good)} .btn.good:hover{border-color:var(--good);background:var(--good-tint)}
.btn.warn{color:var(--warn)} .btn.warn:hover{border-color:var(--warn);background:var(--warn-tint)}
.btn.danger{color:var(--red)} .btn.danger:hover{border-color:var(--red);background:var(--red-tint)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;font-size:.95rem;font-weight:400;color:var(--ink);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end}
.fgrid .wide{grid-column:1/-1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.section{display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy-solid);border-color:var(--navy-solid);color:var(--on-navy)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pagado{background:var(--good-tint);color:var(--good)}
.pill.abono{background:var(--warn-tint);color:var(--warn)}
.pill.no{background:var(--red-tint);color:var(--red)}

/* KPIs */
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kpi .val{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.kpi.main{background:var(--navy-solid);border-color:var(--navy-solid);color:var(--on-navy)}
.kpi.main .lbl{color:var(--on-navy);opacity:.8}
.kpi.main .val{font-size:2.5rem}
.kpi .sub{font-size:.82rem;color:var(--muted)}
.kpi.main .sub{color:var(--on-navy);opacity:.8}
.in{color:var(--good)} .out{color:var(--red)} .due{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpi.main{grid-column:1/-1}.grid2{grid-template-columns:1fr}}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* Stacked bar */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--good)}

/* Eventos */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.evcard{display:flex;gap:14px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.evcard:hover{border-color:var(--navy)}
.datebox{flex:none;width:58px;border-radius:8px;background:var(--navy-solid);color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;font-family:var(--f-display);line-height:1}
.datebox b{font-size:1.8rem}
.datebox span{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.datebox.past{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.evbody{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.evbody h3{overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.kv span:first-child{color:var(--muted)}

.clients{display:flex;flex-direction:column}
.client{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) minmax(0,1fr) auto;gap:6px 16px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:start}
.client:last-child{border-bottom:0}
.client .who b{font-size:1rem;overflow-wrap:anywhere}
.client .money{text-align:right}
.client .money .t{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.client .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pays{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pay{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px}
.pay button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:.9rem;line-height:1}
.pay button:hover{color:var(--red);background:var(--red-tint)}
@media (max-width:760px){.client{grid-template-columns:1fr auto}.client .prod{grid-column:1/-1;order:3}.client .acts{grid-column:1/-1;justify-content:flex-start;order:4}.pays{order:5}}
.totalbox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--navy-tint);border-radius:8px;padding:10px 14px;font-weight:600}
.totalbox b{font-family:var(--f-display);font-size:1.4rem;color:var(--navy)}

/* Calendario */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calhead h2{min-width:190px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:center;padding:4px 0}
.day{min-height:104px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;min-width:0;overflow:hidden}
.day.out-m{background:transparent;border-style:dashed;opacity:.5}
.day .dn{font-weight:700;font-size:.85rem;color:var(--muted)}
.day.today .dn{background:var(--red);color:#fff;border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.day.has-ev{border:2px solid var(--navy-solid);background:var(--navy-tint)}
.day.sel{outline:2px solid var(--sky);outline-offset:1px}
.tag{font-size:.72rem;font-weight:700;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.ev{background:var(--navy-solid);color:var(--on-navy)}
.tag.pg{background:var(--good-tint);color:var(--good)}
.tag.of{background:var(--sky-tint);color:var(--sky)}
.tag.ga{background:var(--red-tint);color:var(--red)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
@media (max-width:640px){.day{min-height:58px;padding:4px}.day .tag{display:none}.dots{display:flex}.calhead h2{min-width:0}}
.dayitems{display:flex;flex-direction:column;gap:8px}
.dayitem{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex-wrap:wrap}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,12,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal .row.end{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.evcard:hover{transform:translateY(-1px)}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="plate"><img src="assets/logo.jpg" alt="Iglesia Cristiana Vida Nueva Internacional"></div>
      <div class="brand-txt"><b>Finanzas</b><span>VIDA NUEVA INTERNACIONAL</span></div>
      <div class="mode" id="mode"><i></i><span>Conectando…</span></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="panel" id="t-panel">Panel</button>
      <button class="tab" role="tab" data-tab="eventos" id="t-eventos">Eventos de venta</button>
      <button class="tab" role="tab" data-tab="calendario" id="t-calendario">Calendario</button>
      <button class="tab" role="tab" data-tab="ofrendas" id="t-ofrendas">Ofrendas</button>
      <button class="tab" role="tab" data-tab="gastos" id="t-gastos">Gastos</button>
      <button class="tab" role="tab" data-tab="ajustes" id="t-ajustes">Ajustes</button>
    </nav>
  </div>
</header>
<main>
  <div id="banner" hidden></div>
  <div id="view" class="section"></div>
</main>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const DEFAULT_METODOS = ["Nequi", "Banco Caja Social", "Efectivo"];
const TIPOS_OFRENDA = ["Ofrenda", "Diezmo", "Primicia", "Pro-templo", "Misiones", "Acción de gracias", "Otra"];
const CATS_GASTO = ["Materiales / insumos", "Servicios públicos", "Arriendo", "Transporte", "Alimentación", "Ayuda social", "Mantenimiento", "Sonido y medios", "Otro"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const LS = "fvni-datos-v1";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COP = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const fmt = n => COP.format(Math.round(Number(n) || 0));
const pad = n => String(n).padStart(2, "0");
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fecha = f => { if (!f) return "Sin fecha"; const [y,m,d] = f.split("-"); return `${+d} ${MESES[+m-1]} ${y}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const n0 = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const sum = (a, f) => a.reduce((s, x) => s + n0(f(x)), 0);
const clone = o => JSON.parse(JSON.stringify(o));

const state = { eventos: [], ofrendas: [], gastos: [], metodos: [...DEFAULT_METODOS], loaded: false, mode: "cargando" };
const ui = { tab: "panel", evSel: null, evFiltro: "todos", evBuscar: "", periodo: "todo", calY: new Date().getFullYear(), calM: new Date().getMonth(), calDia: hoy(), editOf: null, editGa: null, ofBuscar: "", gaBuscar: "" };
try { const s = JSON.parse(localStorage.getItem("fvni-ui") || "{}"); if (s.periodo) ui.periodo = s.periodo; } catch {}

/* ---------- Cálculos ---------- */
const cTotal = c => n0(c.cantidad) * n0(c.valorUnit);
const cPagado = c => sum(c.pagos || [], p => p.monto);
const cEstado = c => { const t = cTotal(c), p = cPagado(c); if (p <= 0) return "no"; if (p >= t) return "pagado"; return "abono"; };
const EST_TXT = { pagado: "Pagado", abono: "Abono parcial", no: "No pagado" };
const evTot = e => { const cl = e.clientes || []; const total = sum(cl, cTotal), pagado = sum(cl, cPagado); return { total, pagado, pendiente: Math.max(0, total - pagado), n: cl.length }; };
const getEv = id => state.eventos.find(e => e.id === id);

function movimientos() {
  const out = [];
  for (const e of state.eventos) for (const c of e.clientes || []) for (const p of c.pagos || [])
    out.push({ fecha: p.fecha, tipo: "venta", desc: `${c.nombre} · ${e.nombre}`, monto: n0(p.monto), metodo: p.metodo || "Sin método" });
  for (const o of state.ofrendas) out.push({ fecha: o.fecha, tipo: "ofrenda", desc: `${o.tipo || "Ofrenda"} · ${o.persona || "Anónimo"}`, monto: n0(o.monto), metodo: o.metodo || "Sin método" });
  for (const g of state.gastos) out.push({ fecha: g.fecha, tipo: "gasto", desc: `${g.concepto} · ${g.categoria || ""}`, monto: -n0(g.monto), metodo: g.metodo || "Sin método" });
  return out.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
}
function enPeriodo(f) {
  if (ui.periodo === "todo") return true;
  if (!f) return false;
  const h = hoy();
  if (ui.periodo === "mes") return f.slice(0, 7) === h.slice(0, 7);
  if (ui.periodo === "anio") return f.slice(0, 4) === h.slice(0, 4);
  return true;
}

/* ---------- Almacenamiento ---------- */
let db = null;
const queues = {};
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({ eventos: state.eventos, ofrendas: state.ofrendas, gastos: state.gastos, metodos: state.metodos })); } catch {} }
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LS) || "null"); if (d) { state.eventos = d.eventos || []; state.ofrendas = d.ofrendas || []; state.gastos = d.gastos || []; state.metodos = d.metodos?.length ? d.metodos : [...DEFAULT_METODOS]; } } catch {}
}
function enqueue(path, fn) {
  queues[path] = (queues[path] || Promise.resolve()).then(fn).catch(e => {
    toast(e?.code === "invalid_argument" ? "No tienes permiso para guardar cambios aquí." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
  });
}

function chartMeses(mv) {

  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ k: `${d.getFullYear()}-${pad(d.getMonth()+1)}`, l: MESES[d.getMonth()], ing: 0, egr: 0 }); }
  for (const m of mv) { const b = months.find(x => x.k === (m.fecha || "").slice(0, 7)); if (!b) continue; if (m.monto >= 0) b.ing += m.monto; else b.egr -= m.monto; }

  for (let v = 0; v <= top + 1; v += step) s += `<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">$${short(v)}</text>`;

    s += `<rect x="${xe}" y="${y(m.egr)}" width="${bw}" height="${Math.max(0, y(0)-y(m.egr))}" rx="3" fill="var(--red)"><title>${m.l}: egresos ${fmt(m.egr)}</title></rect>`;

function mutarCliente(evId, cId, fn) {
  const ev = getEv(evId); if (!ev) return;
  const nev = clone(ev); const c = nev.clientes.find(x => x.id === cId); if (!c) return;
  if (fn(c, nev) === false) return; persist("eventos", evId, nev);
}
function accionCliente(evId, cId, a, pagoId) {
  const ev = getEv(evId); const c = ev?.clientes.find(x => x.id === cId); if (!c) return;
  const pend = Math.max(0, cTotal(c) - cPagado(c));
  if (a === "pagado" || a === "abono") {
    const total = a === "pagado";
    modal(total ? `Registrar pago completo · ${c.nombre}` : `Registrar abono · ${c.nombre}`, `
      <div class="totalbox"><span>Saldo pendiente</span><b class="num">${fmt(pend)}</b></div>
      <div class="fgrid">
        <label>Valor recibido<input type="number" name="monto" id="m-monto" min="0" step="50" value="${total ? pend : ""}"></label>
        <label>Método de pago<select name="metodo" id="m-metodo" data-metodo>${metodoOptions(state.metodos[0])}</select></label>
        <label>Fecha del pago<input type="date" name="fecha" id="m-fecha" value="${hoy()}"></label>
      </div>`, total ? "Marcar como pagado" : "Guardar abono", (d, form) => {
        const m = n0(d.monto);
        if (m <= 0) return fieldErr(form, "monto", "Escribe el valor recibido.");
        if (m > pend) return fieldErr(form, "monto", `El valor supera lo pendiente (${fmt(pend)}).`);
        mutarCliente(evId, cId, cc => { cc.pagos = cc.pagos || []; cc.pagos.push({ id: uid(), monto: m, fecha: d.fecha || hoy(), metodo: d.metodo }); });
        toast(m >= pend ? `${c.nombre} quedó al día` : `Abono de ${fmt(m)} registrado`);
      });
  } else if (a === "nopagado") {
    confirmar("Marcar como no pagado", `Se borrarán los ${c.pagos.length} pago(s) registrados de <b>${esc(c.nombre)}</b> (${fmt(cPagado(c))}). Úsalo solo si los pagos se anotaron por error.`, "Marcar no pagado", () => { mutarCliente(evId, cId, cc => { cc.pagos = []; }); toast("Marcado como no pagado"); });
  } else if (a === "delpago") {
    const p = c.pagos.find(x => x.id === pagoId);
    confirmar("Borrar pago", `¿Borrar el pago de ${fmt(p?.monto)} del ${fecha(p?.fecha)} (${esc(p?.metodo)})?`, "Borrar pago", () => mutarCliente(evId, cId, cc => { cc.pagos = cc.pagos.filter(x => x.id !== pagoId); }));
  } else if (a === "borrar") {
    confirmar("Quitar cliente", `Se quitará a <b>${esc(c.nombre)}</b> de este evento junto con sus pagos (${fmt(cPagado(c))}).`, "Quitar cliente", () => { mutarCliente(evId, cId, (cc, nev) => { nev.clientes = nev.clientes.filter(x => x.id !== cId); }); toast("Cliente quitado"); });
  } else if (a === "editar") {
    modal(`Editar cliente`, `<div class="fgrid">
      <label>Cliente<input name="nombre" id="m-c-nombre" value="${esc(c.nombre)}"></label>
      <label>Teléfono<input name="telefono" id="m-c-tel" value="${esc(c.telefono)}"></label>
      <label class="wide">Producto o servicio<input name="producto" id="m-c-prod" value="${esc(c.producto)}"></label>
      <label>Cantidad<input type="number" name="cantidad" id="m-c-cant" min="0" step="1" value="${n0(c.cantidad)}"></label>
      <label>Valor por unidad<input type="number" name="valorUnit" id="m-c-vu" min="0" step="50" value="${n0(c.valorUnit)}"></label></div>`, "Guardar cambios", (d, form) => {
        if (!d.nombre.trim()) return fieldErr(form, "nombre", "Escribe el nombre del cliente.");
        if (n0(d.cantidad) <= 0) return fieldErr(form, "cantidad", "La cantidad debe ser mayor que cero.");
        mutarCliente(evId, cId, cc => Object.assign(cc, { nombre: d.nombre.trim(), telefono: d.telefono.trim(), producto: d.producto.trim(), cantidad: n0(d.cantidad), valorUnit: n0(d.valorUnit) }));
        toast("Cliente actualizado");
      });
  }
}

/* ---------- CALENDARIO ---------- */
function itemsPorDia() {
  const map = {};
  const add = (f, it) => { if (!f) return; (map[f] ??= []).push(it); };
  for (const e of state.eventos) {
    add(e.fecha, { k: "ev", txt: e.nombre, ev: e.id });
    for (const c of e.clientes || []) for (const p of c.pagos || []) add(p.fecha, { k: "pg", txt: `${c.nombre} · ${e.nombre}`, monto: n0(p.monto), metodo: p.metodo, ev: e.id });
  }
  for (const o of state.ofrendas) add(o.fecha, { k: "of", txt: `${o.tipo} · ${o.persona || "Anónimo"}`, monto: n0(o.monto), metodo: o.metodo });
  for (const g of state.gastos) add(g.fecha, { k: "ga", txt: g.concepto, monto: n0(g.monto), metodo: g.metodo });
  return map;
}

function registroView(cfg) {
  return {
    shell: () => { ui[cfg.editKey] = null; return `<div class="head"><div><div class="eyebrow">${cfg.eyebrow}</div><h2>${cfg.titulo}</h2></div></div>

          <div class="row"><button class="btn primary" id="${cfg.p}-save">${cfg.btn}</button><button type="button" class="btn" id="${cfg.p}-cancel" hidden>Cancelar edición</button></div></form>
        </div>
        <div class="card section" id="${cfg.p}-resumen"></div>
      </div>
      <div class="card section"><div class="head"><h3>${cfg.lista}</h3><div class="row"><input type="search" id="${cfg.p}-buscar" placeholder="Buscar" style="width:200px"><select id="${cfg.p}-mes" style="width:auto"></select></div></div><div id="${cfg.p}-list"></div></div>`; },

        e.preventDefault(); const d = Object.fromEntries(new FormData(f));
        const err = cfg.validar(d); if (err) return fieldErr(f, err[0], err[1]);
        const id = ui[cfg.editKey] || uid();

        salirEdicion();
      };
      const salirEdicion = () => { ui[cfg.editKey] = null; f.reset(); f.fecha.value = hoy(); fillMetodoSelects(); $(`#${cfg.p}-ftitle`).textContent = cfg.nuevo; $(`#${cfg.p}-save`).textContent = cfg.btn; $(`#${cfg.p}-cancel`).hidden = true; };
      $(`#${cfg.p}-cancel`, v).onclick = salirEdicion;
      cfg.salir = salirEdicion;
      $(`#${cfg.p}-buscar`, v).oninput = () => refresh();
      $(`#${cfg.p}-mes`, v).onchange = () => refresh();
    },
    data: () => {
      const list = $(`#${cfg.p}-list`); if (!list) return;
      const all = [...state[cfg.col]].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
      const mesSel = $(`#${cfg.p}-mes`); const prev = mesSel.value;
      const meses = [...new Set(all.map(x => (x.fecha || "").slice(0, 7)).filter(Boolean))];
      mesSel.innerHTML = `<option value="">Todos los meses</option>` + meses.map(m => `<option value="${m}" ${m === prev ? "selected" : ""}>${MESES_L[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join("");
      const q = $(`#${cfg.p}-buscar`).value.trim().toLowerCase(); const mes = mesSel.value;
      const rows = all.filter(x => (!mes || (x.fecha || "").startsWith(mes)) && (!q || cfg.texto(x).toLowerCase().includes(q)));
      // resumen
      const total = sum(rows, x => x.monto);
      const porCat = {}; rows.forEach(x => { const k = x[cfg.catField] || "Otro"; porCat[k] = (porCat[k] || 0) + n0(x.monto); });
      const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]); const max = Math.max(...cats.map(c => c[1]), 1);
      $(`#${cfg.p}-resumen`).innerHTML = `<div><div class="muted small">${mes ? "Total de " + MESES_L[+mes.slice(5)-1] + " " + mes.slice(0,4) : "Total registrado"}${q ? " (filtrado)" : ""}</div>
        <div class="num" style="font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--${cfg.color})">${fmt(total)}</div><div class="muted small">${rows.length} registro${rows.length===1?"":"s"}</div></div>
        <h3>Por ${cfg.catLabel}</h3>
        ${cats.length ? cats.map(([k, v]) => `<div class="section" style="gap:4px"><div class="kv num"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="progress"><span style="width:${v/max*100}%;background:var(--${cfg.color})"></span></div></div>`).join("") : `<p class="muted small" style="margin:0">Sin datos aún.</p>`}`;
      if (!state.loaded) { list.innerHTML = `<div class="empty">Cargando…</div>`; return; }

        </tbody></table></div>`;

        const id = b.closest("tr").dataset.id; const x = state[cfg.col].find(r => r.id === id); if (!x) return;
        if (b.dataset.a === "del") return confirmar("Borrar registro", `¿Borrar ${esc(cfg.texto(x))} por ${fmt(x.monto)}?`, "Borrar", () => { persist(cfg.col, id, null); if (ui[cfg.editKey] === id) cfg.salir?.(); toast("Registro borrado"); });
        ui[cfg.editKey] = id; const f = $(`#${cfg.p}-form`);

        f.scrollIntoView({ behavior: "smooth", block: "center" }); f.elements[0].focus({ preventScroll: true });
      });
    }
  };
}

  p: "ga", col: "gastos", editKey: "editGa", eyebrow: "Egresos", titulo: "Gastos", nuevo: "Registrar gasto", btn: "Guardar gasto", lista: "En qué se ha invertido el dinero", ok: "Gasto registrado", color: "red",
  catField: "categoria", catLabel: "categoría",
  vacio: ["Aún no hay gastos registrados", "Anota cada compra o pago que haga la iglesia para que el saldo quede exacto."],
  campos: () => `
    <label>Fecha<input type="date" name="fecha" id="ga-fecha" value="${hoy()}"></label>
    <label>Concepto<input name="concepto" id="ga-concepto" placeholder="Ej: Harina y aceite para la venta"></label>
    <label>Categoría<select name="categoria" id="ga-cat">${CATS_GASTO.map(t => `<option>${t}</option>`).join("")}</select></label>
    <label>Valor (COP)<input type="number" name="monto" id="ga-monto" min="0" step="50"></label>
    <label>Pagado con<select name="metodo" id="ga-metodo" data-metodo>${metodoOptions(state.metodos[0])}</select></label>
    <label class="wide">Nota<input name="nota" id="ga-nota" placeholder="Proveedor, factura, responsable…"></label>`,
  validar: d => !d.concepto.trim() ? ["concepto", "Escribe en qué se gastó."] : n0(d.monto) <= 0 ? ["monto", "Escribe el valor del gasto."] : null,
  armar: d => ({ fecha: d.fecha || hoy(), concepto: d.concepto.trim(), categoria: d.categoria, monto: n0(d.monto), metodo: d.metodo, nota: d.nota.trim() }),
  texto: x => `${x.concepto} ${x.categoria} ${x.nota || ""}`,
  cols: [["Fecha"], ["Concepto"], ["Categoría"], ["Método"], ["Valor", "r"]],
  fila: x => `<td class="num" style="white-space:nowrap">${fecha(x.fecha)}</td><td>${esc(x.concepto)}${x.nota ? `<div class="muted small">${esc(x.nota)}</div>` : ""}</td><td><span class="tag ga">${esc(x.categoria)}</span></td><td class="muted">${esc(x.metodo)}</td><td class="r num out" style="white-space:nowrap"><b>${fmt(x.monto)}</b></td>`
});

/* ---------- MÉTODOS DE PAGO ---------- */
views.ajustes = {
  shell: () => `<div class="head"><div><div class="eyebrow">Configuración</div><h2>Métodos de pago</h2></div></div>
    <div class="card section" style="max-width:640px">
      <p class="muted" style="margin:0">Estos métodos aparecen al registrar pagos, ofrendas y gastos. Quitar un método no borra los registros que ya lo usan.</p>
      <div id="met-list" class="section" style="gap:8px"></div>
      <form id="met-form" class="row" novalidate><input name="nuevo" id="met-nuevo" placeholder="Ej: Daviplata, Bancolombia, Transferencia" style="flex:1;min-width:180px"><button class="btn primary">Agregar método</button></form>
    </div>
    <div class="head"><div><div class="eyebrow">Respaldo</div><h2>Copia de seguridad</h2></div></div>
    <div class="card section" style="max-width:640px">
      <p class="muted" style="margin:0">Los datos se guardan en este navegador. Descarga una copia con frecuencia y úsala para pasar la información a otro computador o celular.</p>
      <div class="row"><button class="btn primary" id="bk-exp">Descargar copia (.json)</button>
      <label class="btn" style="flex-direction:row;color:var(--ink);font-size:.95rem">Restaurar copia<input type="file" id="bk-imp" accept="application/json,.json" hidden></label></div>
    </div>`,
  bind: v => {
    $("#met-form", v).onsubmit = e => {
      e.preventDefault(); const val = e.target.nuevo.value.trim();
      if (!val) return fieldErr(e.target, "nuevo", "Escribe el nombre del método.");
      if (state.metodos.some(m => m.toLowerCase() === val.toLowerCase())) return fieldErr(e.target, "nuevo", "Ese método ya existe.");
      saveMetodos([...state.metodos, val]); e.target.reset(); toast(`${val} agregado`);
    };
    $("#bk-exp", v).onclick = () => {
      const data = JSON.stringify({ app: "finanzas-vida-nueva", version: 1, exportado: new Date().toISOString(), eventos: state.eventos, ofrendas: state.ofrendas, gastos: state.gastos, metodos: state.metodos }, null, 2);
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = `finanzas-vida-nueva-${hoy()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Copia descargada");
    };
    $("#bk-imp", v).onchange = e => {
      const file = e.target.files[0]; e.target.value = ""; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        let d; try { d = JSON.parse(r.result); } catch { return toast("El archivo no es una copia válida."); }
        if (!Array.isArray(d.eventos) || !Array.isArray(d.ofrendas) || !Array.isArray(d.gastos)) return toast("El archivo no es una copia de Finanzas Vida Nueva.");
        confirmar("Restaurar copia", `Se reemplazarán los datos actuales por los de la copia (${d.eventos.length} eventos, ${d.ofrendas.length} ofrendas, ${d.gastos.length} gastos).`, "Restaurar", () => {
          state.eventos = d.eventos; state.ofrendas = d.ofrendas; state.gastos = d.gastos;
          state.metodos = Array.isArray(d.metodos) && d.metodos.length ? d.metodos : [...DEFAULT_METODOS];
          saveLocal(); fillMetodoSelects(); refresh(); toast("Copia restaurada");
        });
      };
      r.readAsText(file);
    };
  },
  data: () => {
    const box = $("#met-list"); if (!box) return;
    const uso = {}; movimientos().forEach(m => uso[m.metodo] = (uso[m.metodo] || 0) + 1);
    box.innerHTML = state.metodos.map((m, i) => `<div class="dayitem"><div><b>${esc(m)}</b><div class="muted small">${uso[m] || 0} movimiento${uso[m]===1?"":"s"}</div></div>
      <div class="row"><button class="btn sm ghost" data-up="${i}" ${i ? "" : "disabled"} aria-label="Subir">↑</button><button class="btn sm ghost danger" data-del="${i}" ${state.metodos.length > 1 ? "" : "disabled"}>Quitar</button></div></div>`).join("");
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const m = state.metodos[+b.dataset.del]; confirmar("Quitar método", `¿Quitar <b>${esc(m)}</b> de la lista? Los registros existentes lo conservan.`, "Quitar", () => saveMetodos(state.metodos.filter(x => x !== m))); });
    box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; const l = [...state.metodos]; [l[i-1], l[i]] = [l[i], l[i-1]]; saveMetodos(l); });
  }
};

/* ---------- Arranque ---------- */
function setMode(cls, txt) { const m = $("#mode"); m.className = "mode " + cls; m.querySelector("span").textContent = txt; }
function boot() {
  const initial = (location.hash || "").slice(1);
  loadLocal(); state.loaded = true; state.mode = "local";
  setMode("local", "Guardado en este navegador");
  showTab(views[initial] ? initial : "panel");
}
boot();
})();
</script>
</body>
</html>
